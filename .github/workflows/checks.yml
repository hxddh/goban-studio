name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run release-check
      - run: npm run build
      - run: npm run sync
      - run: test -s frontend/dist/js/bundle.js && test -s frontend/dist/index.html

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run sync
      # Interaction flows, performance budgets, four-language rendering and
      # visual regression against tests/visual (diffs uploaded on failure).
      - run: node scripts/ui-test.mjs
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-diffs
          path: tests/visual/diff
          if-no-files-found: ignore
