name: build-windows

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to upload to (optional)
        required: false
        default: ""
      sdk_version:
        description: "@native-sdk/cli version"
        required: false
        default: "0.11.0"
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: false
        default: ""
      sdk_version:
        type: string
        required: false
        default: "0.11.0"
    # Optional: with both, the exe and katago.exe are Authenticode-signed;
    # without them the build is unsigned (docs/signing.md). release.yml
    # passes them with `secrets: inherit`.
    secrets:
      WINDOWS_CERT_PFX_BASE64:
        required: false
      WINDOWS_CERT_PASSWORD:
        required: false
    outputs:
      signing:
        description: "authenticode | unsigned"
        value: ${{ jobs.build.outputs.signing }}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      signing: ${{ steps.status.outputs.signing }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: install build dependencies
        run: npm ci
      - name: content gate
        run: npm run release-check
      - name: unit tests
        run: npm test
      - name: download KataGo Eigen sidecar
        run: |
          curl -L --fail -sS -o "$RUNNER_TEMP/katago.zip" \
            https://github.com/lightvector/KataGo/releases/download/v1.18.1/katago-v1.18.1-eigen-windows-x64.zip
          mkdir -p engine/windows
          powershell -NoProfile -Command "Expand-Archive -Path '$RUNNER_TEMP/katago.zip' -DestinationPath 'engine/windows' -Force"
          test -f engine/windows/katago.exe
          test -f engine/windows/msvcp140.dll
          test -f engine/windows/libcrypto-3-x64.dll
      - name: KataGo smoke test
        run: |
          set -euo pipefail
          move=$(printf 'boardsize 19\nkomi 6.5\nkata-set-rules japanese\nplay B Q16\ngenmove W\nquit\n' | \
            ./engine/windows/katago.exe gtp -model engine/model/model.txt.gz -config engine/model/gtp.cfg \
            -override-config "logDir=$RUNNER_TEMP,homeDataDir=$RUNNER_TEMP,logAllGTPCommunication=false,logSearchInfo=false,logToStderr=false,ponderingEnabled=false,allowResignation=false" \
            | grep -E '^= [A-HJ-T][0-9]+' | tail -1)
          test -n "$move"
          echo "KataGo answered: $move"
      - name: install Native SDK CLI
        env:
          SDK_VERSION: ${{ inputs.sdk_version || '0.11.0' }}
        run: |
          npm install -g "@native-sdk/cli@${SDK_VERSION}"
          echo "SDK_PATH=$(npm root -g)/@native-sdk/cli" >> "$GITHUB_ENV"
          native --version
      - name: build frontend
        run: |
          npm run build
          npm run sync
          node scripts/release-check.mjs
      - name: native validate and tests
        run: |
          npx --yes @native-sdk/cli@"${{ inputs.sdk_version || '0.11.0' }}" validate
          npx --yes @native-sdk/cli@"${{ inputs.sdk_version || '0.11.0' }}" test --yes \
            -Dnative-sdk-path="$SDK_PATH" -Dplatform=windows
      - name: native release build
        run: |
          npx --yes @native-sdk/cli@"${{ inputs.sdk_version || '0.11.0' }}" build --yes \
            -Dnative-sdk-path="$SDK_PATH" -Dplatform=windows -Doptimize=ReleaseFast
      - name: package app and install engine
        run: |
          mkdir -p dist
          rm -rf dist/GobanStudio
          native package --target windows --assets frontend/dist \
            --output dist/GobanStudio --binary zig-out/bin/goban-studio.exe
          node scripts/install-engine.mjs dist/GobanStudio windows
          cp packaging/README-Windows.txt dist/GobanStudio/README-Windows.txt
          test -f dist/GobanStudio/resources/frontend/dist/engine/windows/katago.exe
          test -f dist/GobanStudio/resources/frontend/dist/engine/windows/msvcp140.dll
          test -f dist/GobanStudio/resources/frontend/dist/engine/windows/libcrypto-3-x64.dll
          test -f dist/GobanStudio/resources/frontend/dist/engine/model/model.txt.gz
          test -f dist/GobanStudio/resources/frontend/dist/licenses/Goban-Studio-MIT.txt
          ls -R dist/GobanStudio | head -40
      - name: signing mode
        id: mode
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if [ -n "$WINDOWS_CERT_PFX_BASE64" ] && [ -n "$WINDOWS_CERT_PASSWORD" ]; then
            echo "mode=authenticode" >> "$GITHUB_OUTPUT"
            echo "Windows signing: authenticode"
          else
            echo "mode=unsigned" >> "$GITHUB_OUTPUT"
            echo "::notice title=Windows signing::WINDOWS_CERT_PFX_BASE64 / WINDOWS_CERT_PASSWORD not set; building an UNSIGNED package. See docs/signing.md."
          fi
      - name: Authenticode-sign goban-studio.exe and katago.exe
        if: ${{ steps.mode.outputs.mode == 'authenticode' }}
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          $pfx = Join-Path $env:RUNNER_TEMP "goban-cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          try {
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
              Where-Object { $_.FullName -match "\\x64\\" } | Sort-Object FullName -Descending | Select-Object -First 1
            if (-not $signtool) { throw "signtool.exe not found in the Windows SDK" }
            Write-Host "signtool: $($signtool.FullName)"
            $files = @(
              (Get-ChildItem -Recurse -Filter goban-studio.exe dist/GobanStudio | Select-Object -First 1).FullName,
              (Get-ChildItem -Recurse -Filter katago.exe dist/GobanStudio | Select-Object -First 1).FullName
            )
            foreach ($f in $files) { if (-not $f -or -not (Test-Path $f)) { throw "missing file to sign: $f" } }
            # SHA-256 file digest, RFC 3161 timestamp (SHA-256), so the
            # signature stays valid after the certificate expires.
            & $signtool.FullName sign /fd sha256 /f $pfx /p $env:WINDOWS_CERT_PASSWORD `
              /tr http://timestamp.digicert.com /td sha256 /d "Goban Studio" $files
            if ($LASTEXITCODE -ne 0) { throw "signtool sign failed ($LASTEXITCODE)" }
            foreach ($f in $files) {
              & $signtool.FullName verify /pa /v $f
              if ($LASTEXITCODE -ne 0) { throw "signtool verify failed for $f" }
              $sig = Get-AuthenticodeSignature $f
              Write-Host "$f : $($sig.Status) — $($sig.SignerCertificate.Subject) — timestamp: $($sig.TimeStamperCertificate.Subject)"
              if ($sig.Status -ne "Valid") { throw "signature on $f is $($sig.Status)" }
              if (-not $sig.TimeStamperCertificate) { throw "signature on $f has no timestamp" }
            }
          } finally {
            Remove-Item -Force $pfx -ErrorAction SilentlyContinue
          }
      - name: signing status and README
        id: status
        run: |
          set -euo pipefail
          if [ "${{ steps.mode.outputs.mode }}" = "authenticode" ]; then
            node scripts/signing-notes.mjs status windows authenticode --timestamped > dist/signing-windows.json
            echo "signing=authenticode" >> "$GITHUB_OUTPUT"
            echo "### Windows: Authenticode-signed and timestamped" >> "$GITHUB_STEP_SUMMARY"
          else
            node scripts/signing-notes.mjs status windows unsigned > dist/signing-windows.json
            echo "signing=unsigned" >> "$GITHUB_OUTPUT"
            echo "### Windows: NOT Authenticode-signed (signing secrets not set; docs/signing.md)" >> "$GITHUB_STEP_SUMMARY"
          fi
          cat dist/signing-windows.json
          # The README in the package says how this build was signed.
          node scripts/signing-notes.mjs readme packaging/README-Windows.txt dist/signing-windows.json > dist/GobanStudio/README-Windows.txt
      - name: capture packaged app
        shell: pwsh
        continue-on-error: true
        env:
          WEBVIEW2_USER_DATA_FOLDER: ${{ runner.temp }}\goban-webview2-capture
        run: |
          $exe = (Get-ChildItem -Recurse -Filter goban-studio.exe dist/GobanStudio | Select-Object -First 1).FullName
          $env:GOBAN_SELFTEST_OUT = Join-Path $env:TEMP "goban-window-report.json"
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 12
          Write-Host "report exists: $(Test-Path $env:GOBAN_SELFTEST_OUT)"
          try {
            Add-Type -AssemblyName System.Windows.Forms
            Add-Type -AssemblyName System.Drawing
            $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
            $bitmap.Save("$PWD\windows-app.png", [System.Drawing.Imaging.ImageFormat]::Png)
            Write-Host "screen captured"
          } catch {
            Write-Host "screen capture unavailable: $($_.Exception.Message)"
          }
          if (!$p.HasExited) { Stop-Process -Id $p.Id -Force }
          if (Test-Path $env:GOBAN_SELFTEST_OUT) { Get-Content $env:GOBAN_SELFTEST_OUT }
      - name: upload diagnostic screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: GobanStudio-Windows-diagnostic
          path: windows-app.png
          if-no-files-found: ignore
      - name: self-test the packaged app
        # v5: includes the optional downloads end to end (pinned KataGo
        # release assets, 99 MB + 48 MB, into a temporary folder; see
        # scripts/selftest-app.mjs). GOBAN_SELFTEST_MODELS=0 skips them.
        timeout-minutes: 10
        env:
          WEBVIEW2_USER_DATA_FOLDER: ${{ runner.temp }}\goban-webview2-selftest
        run: |
          exe="$(find dist/GobanStudio -name goban-studio.exe | head -n1)"
          test -n "$exe"
          node scripts/selftest-app.mjs "$exe"
      - name: updater end-to-end tests (swap with a locked file, rollback, no exit, read-only fallback)
        timeout-minutes: 10
        run: node scripts/test-updater.mjs dist/GobanStudio
      - name: updater live download from GitHub (network; informational)
        # Depends on github.com and on a published release, so it does not
        # gate the build.
        continue-on-error: true
        timeout-minutes: 12
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset="GobanStudio-Windows-x64.zip"
          tag="$(gh api 'repos/hxddh/goban-studio/releases?per_page=30' \
            --jq "[.[] | select(.draft == false and .prerelease == false) | select(any(.assets[]; .name == \"$asset\")) | select(any(.assets[]; .name == \"SHA256SUMS\"))] | .[0].tag_name // empty")"
          if [ -z "$tag" ]; then
            echo "::notice title=updater live test::no published release has $asset yet; skipped"
            exit 0
          fi
          node scripts/test-updater.mjs dist/GobanStudio --live "$tag"
      - name: native screenshot tour
        timeout-minutes: 6
        env:
          WEBVIEW2_USER_DATA_FOLDER: ${{ runner.temp }}\goban-webview2-tour
        run: |
          # Today, a 19x19 game, its review, Practice and Settings, captured
          # with System.Drawing; each must be non-blank and differ from the
          # one before (scripts/screenshots.mjs).
          exe="$(find dist/GobanStudio -name goban-studio.exe | head -n1)"
          node scripts/tour-app.mjs "$exe" screenshots-windows
      - name: upload native screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-screenshots-windows
          path: screenshots-windows
          if-no-files-found: ignore
      - name: remove WebView2 test profile
        shell: pwsh
        run: |
          $profiles = Get-ChildItem -Path dist/GobanStudio -Recurse -Force -Directory -Filter "*.WebView2"
          foreach ($profile in $profiles) { Remove-Item -LiteralPath $profile.FullName -Recurse -Force }
          $profiles = Get-ChildItem -Path dist/GobanStudio -Recurse -Force -Directory -Filter "EBWebView"
          foreach ($profile in $profiles) { Remove-Item -LiteralPath $profile.FullName -Recurse -Force }
          $left = Get-ChildItem -Path dist/GobanStudio -Recurse -Force -Directory -Filter "*.WebView2"
          if ($left) { throw "WebView2 test profile remains in the package" }
          Write-Host "WebView2 test profile removed"
      - name: zip
        run: |
          python scripts/make-zip.py dist/GobanStudio dist/GobanStudio-Windows-x64.zip GobanStudio
          python - <<'PY'
          import zipfile
          z = zipfile.ZipFile("dist/GobanStudio-Windows-x64.zip")
          names = z.namelist()
          assert names, "empty archive"
          assert all("\\" not in n for n in names), "backslash in ZIP entry"
          assert any(n.endswith("bin/goban-studio.exe") for n in names), "missing exe"
          assert any(n.endswith("engine/windows/msvcp140.dll") for n in names), "missing MSVC runtime"
          assert any(n.endswith("engine/windows/libcrypto-3-x64.dll") for n in names), "missing OpenSSL runtime"
          assert any(n.endswith("licenses/Goban-Studio-MIT.txt") for n in names), "missing app licence"
          assert not any(".WebView2/" in n or "/EBWebView/" in n for n in names), "WebView2 test profile leaked"
          # v5: the in-app updater unpacks this archive and expects every
          # entry under GobanStudio/ (src/install.zig safeEntryName).
          assert all(n.startswith("GobanStudio/") and ":" not in n and "/../" not in n for n in names), "entry outside GobanStudio/"
          assert any(n == "GobanStudio/resources/frontend/dist/index.html" for n in names), "missing index.html"
          info = z.getinfo(next(n for n in names if n.endswith("bin/goban-studio.exe")))
          assert info.external_attr >> 16 & 0o111, "exe has no execute bits"
          print(f"zip entries: {len(names)}; forward slashes; Unix modes present")
          PY
          ls -lh dist
      - uses: actions/upload-artifact@v7
        with:
          name: GobanStudio-Windows-x64
          path: dist/GobanStudio-Windows-x64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: signing-status-windows
          path: dist/signing-windows.json
      - name: upload to release
        if: ${{ inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: gh release upload "$TAG" dist/GobanStudio-Windows-x64.zip --clobber
