name: release

# One complete release: all content, every desktop package (macOS Apple
# Silicon, macOS Intel, Windows x64) and the 19x19 KataGo sidecar must be
# green before a tag or release exists.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.0.0; must be v + package.json version; notes file must exist"
        required: true
      rehearse:
        description: "Run every gate and both builds, publish nothing (allowed from any branch)"
        type: boolean
        required: false
        default: false

# Read-only by default; only the jobs that write a release get more.
permissions:
  contents: read

env:
  NPM_CONFIG_ENGINE_STRICT: "true"

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: branch, version, notes, and the tag is not already published
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          REHEARSE: ${{ inputs.rehearse }}
        run: |
          set -euo pipefail
          # The tag is created at the commit that was built ($GITHUB_SHA), so
          # a release is only ever cut from main.
          if [ "$REHEARSE" != "true" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error title=release::run the release from main (this run is on $GITHUB_REF); rehearse=true runs anywhere"
            exit 1
          fi
          version="$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "v${version}" ]; then
            if [ "$REHEARSE" = "true" ]; then
              echo "::warning title=release::tag $TAG does not match package.json version v${version}; a real release would stop here"
            else
              echo "::error title=release::tag $TAG does not match package.json version v${version}"
              exit 1
            fi
          fi
          # The update signing key is a secret of the `release-signing`
          # environment and cannot be seen from here: the `sign` job checks
          # it. If it is missing there, nothing is published, and that job
          # can be re-run once the secret is in place (the packages are kept
          # as artifacts).
          if [ "$REHEARSE" = "true" ]; then echo "rehearsal: nothing will be tagged"; exit 0; fi
          test -f ".github/release-notes/${TAG}.md" || { echo "missing .github/release-notes/${TAG}.md"; exit 1; }
          published=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq "[.[] | select(.tag_name==\"${TAG}\") | select(.draft==false)] | .[0].id // empty")
          [ -z "$published" ] || { echo "${TAG} is already published"; exit 1; }

  macos:
    needs: preflight
    # The platform builds write nothing to the repository: they hand their
    # packages to the assemble job as artifacts.
    permissions:
      contents: read
    uses: ./.github/workflows/build-macos.yml
    with:
      runner: macos-15
      arch: arm64
    # Signing secrets are optional (docs/signing.md); without them the
    # build is ad-hoc signed and the notes say so. In the called workflow
    # they reach only the steps that sign.
    secrets: inherit

  # v5: a native Intel build (KataGo built for x86_64 on the Intel runner),
  # self-tested and updater-tested on real Intel hardware. A separate
  # package rather than a universal one: each build is tested on the CPU it
  # ships for, the jobs run in parallel, and each download stays ~half the
  # size of a universal app with two KataGo and two app binaries.
  macos-intel:
    needs: preflight
    permissions:
      contents: read
    uses: ./.github/workflows/build-macos.yml
    with:
      runner: macos-15-intel
      arch: x64
    secrets: inherit

  windows:
    needs: preflight
    permissions:
      contents: read
    uses: ./.github/workflows/build-windows.yml
    secrets: inherit

  # Everything a release holds, checked and checksummed, with a read-only
  # token and no secret. Rehearsals stop after this job.
  assemble:
    needs: [preflight, macos, macos-intel, windows]
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.macos.result == 'success' && needs.macos-intel.result == 'success' && needs.windows.result == 'success' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: GobanStudio-macOS-arm64
          path: dist-macos
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: GobanStudio-macOS-x64
          path: dist-macos
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: GobanStudio-Windows-x64
          path: dist-windows
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signing-status-macos
          path: signing
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signing-status-macos-x64
          path: signing
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signing-status-windows
          path: signing
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: release notes with the real signing status
        env:
          TAG: ${{ inputs.tag }}
          MAC_SIGNING: ${{ needs.macos.outputs.signing }}
          MAC_INTEL_SIGNING: ${{ needs.macos-intel.outputs.signing }}
          WIN_SIGNING: ${{ needs.windows.outputs.signing }}
        run: |
          set -euo pipefail
          echo "macOS arm64: ${MAC_SIGNING:-unknown}; macOS x64: ${MAC_INTEL_SIGNING:-unknown}; Windows: ${WIN_SIGNING:-unknown}"
          cat signing/signing-macos.json signing/signing-macos-x64.json signing/signing-windows.json
          notes=".github/release-notes/${TAG}.md"
          if [ ! -f "$notes" ]; then
            # Rehearsal without a notes file: a stub, so the table is still shown.
            printf '# Goban Studio %s\n\n## Download and first launch\n' "$TAG" > "$RUNNER_TEMP/stub.md"
            notes="$RUNNER_TEMP/stub.md"
          fi
          # The "First launch" table follows what the builds actually did,
          # whatever the notes file says.
          node scripts/signing-notes.mjs notes "$notes" signing/signing-macos.json signing/signing-windows.json signing/signing-macos-x64.json > release-notes.md
          {
            echo "## Release notes as they will be published"
            echo
            cat release-notes.md
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
      - name: verify packages
        run: |
          set -euo pipefail
          test -s dist-macos/GobanStudio-macOS-arm64.zip
          test -s dist-macos/GobanStudio-macOS-arm64.dmg
          test -s dist-macos/GobanStudio-macOS-x64.zip
          test -s dist-macos/GobanStudio-macOS-x64.dmg
          test -s dist-windows/GobanStudio-Windows-x64.zip
          ls -lh dist-macos dist-windows
      - name: checksums
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # The in-app updater checks the .zip it downloads against this
          # file's line for that exact name.
          (cd dist-macos && sha256sum GobanStudio-macOS-arm64.zip GobanStudio-macOS-arm64.dmg GobanStudio-macOS-x64.zip GobanStudio-macOS-x64.dmg) > SHA256SUMS
          (cd dist-windows && sha256sum GobanStudio-Windows-x64.zip) >> SHA256SUMS
          # The sums name the release they are for: VERSION holds the tag
          # and a newline, and its line here is covered by the signature.
          # An app refuses sums whose VERSION is not the tag it asked for
          # (src/install_verify.zig sumsBinding), so one release's signed files
          # cannot be offered as another's. Older apps skip the line.
          printf '%s\n' "$TAG" > VERSION
          sha256sum VERSION >> SHA256SUMS
          cat SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 6
          sha256sum -c --ignore-missing SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checksums
          path: |
            SHA256SUMS
            VERSION
          if-no-files-found: error

  # The one job that holds the update signing key. It never runs in a
  # rehearsal, and it runs in the protected environment `release-signing`:
  # the key is an environment secret there, so a run needs the
  # environment's reviewers' approval and its branch rule (main) before the
  # key exists for it (docs/signing.md, "Update signing in CI"). It checks
  # out nothing but the signing script and signs exactly the bytes the
  # assemble job produced.
  sign:
    needs: [preflight, assemble]
    if: ${{ !cancelled() && inputs.rehearse != true && needs.assemble.result == 'success' }}
    runs-on: ubuntu-latest
    environment: release-signing
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            scripts/sign-sums.mjs
            .nvmrc
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: checksums
      - name: the sums are for this tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = "$TAG"
          grep -x "$(sha256sum VERSION)" SHA256SUMS
      - name: sign SHA256SUMS
        # SHA256SUMS.sig is what an app built with vars.UPDATE_PUBKEY trusts
        # (docs/signing.md, "Update signing in CI"). The private key reaches
        # this step only.
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          UPDATE_PUBKEY: ${{ vars.UPDATE_PUBKEY }}
        run: |
          set -euo pipefail
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            if [ -n "$UPDATE_PUBKEY" ]; then
              echo "::error title=update signing::the apps enforce signed updates (vars.UPDATE_PUBKEY) but UPDATE_SIGNING_KEY is not set in the release-signing environment"
              exit 1
            fi
            echo "::notice title=update signing::UPDATE_SIGNING_KEY not set; SHA256SUMS ships unsigned (docs/signing.md)"
            exit 0
          fi
          node scripts/sign-sums.mjs
          test -s SHA256SUMS.sig
          echo "SHA256SUMS.sig written"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checksums-signature
          path: SHA256SUMS.sig
          if-no-files-found: ignore

  publish:
    needs: [preflight, assemble, sign]
    if: ${{ !cancelled() && inputs.rehearse != true && needs.assemble.result == 'success' && needs.sign.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: GobanStudio-macOS-arm64
          path: dist-macos
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: GobanStudio-macOS-x64
          path: dist-macos
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: GobanStudio-Windows-x64
          path: dist-windows
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: checksums
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: checksums-signature
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
      - name: the packages are the ones that were checksummed
        run: |
          set -euo pipefail
          mkdir check
          cp dist-macos/* dist-windows/* VERSION check/
          (cd check && sha256sum -c ../SHA256SUMS)
          rm -rf check
      - name: publish
        if: ${{ inputs.rehearse != true }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # A tag that already exists keeps its commit (gh ignores --target
          # then): refuse one that points anywhere but the commit built here.
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" > /dev/null 2>&1; then
            commit="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TAG}" --jq .sha)"
            [ "$commit" = "$GITHUB_SHA" ] || { echo "::error::tag ${TAG} exists at ${commit}, not at the built commit ${GITHUB_SHA}"; exit 1; }
          fi
          assets=(
            dist-macos/GobanStudio-macOS-arm64.zip
            dist-macos/GobanStudio-macOS-arm64.dmg
            dist-macos/GobanStudio-macOS-x64.zip
            dist-macos/GobanStudio-macOS-x64.dmg
            dist-windows/GobanStudio-Windows-x64.zip
            SHA256SUMS
            VERSION
          )
          if [ -f SHA256SUMS.sig ]; then assets+=(SHA256SUMS.sig); fi
          # --target: the tag is created at the commit every package was
          # built from, not wherever main points when the builds finish.
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --draft \
            --title "Goban Studio $TAG" \
            --notes-file release-notes.md
          # Into the draft only, and never over a file that is there: a
          # published release's files are not replaced, by this workflow or
          # any other (there is no upload path outside this job).
          gh release upload "$TAG" "${assets[@]}"
          gh release edit "$TAG" --draft=false
          gh release view "$TAG" --json url,isDraft,assets
