name: release

# One complete v1.0: all content, both desktop packages and the 19x19 KataGo
# sidecar must be green before a tag or release exists.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.0.0; notes file must exist"
        required: true
      sdk_version:
        description: "@native-sdk/cli version used by both platform builds"
        required: false
        default: "0.11.0"
      rehearse:
        description: "Run every gate and both builds, publish nothing"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  actions: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: notes exist and tag is not already published
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          REHEARSE: ${{ inputs.rehearse }}
        run: |
          set -euo pipefail
          if [ "$REHEARSE" = "true" ]; then echo "rehearsal: nothing will be tagged"; exit 0; fi
          test -f ".github/release-notes/${TAG}.md" || { echo "missing .github/release-notes/${TAG}.md"; exit 1; }
          published=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq "[.[] | select(.tag_name==\"${TAG}\") | select(.draft==false)] | .[0].id // empty")
          [ -z "$published" ] || { echo "${TAG} is already published"; exit 1; }

  macos:
    needs: preflight
    uses: ./.github/workflows/build-macos.yml
    with:
      sdk_version: ${{ inputs.sdk_version }}
    # Signing secrets are optional (docs/signing.md); without them the
    # build is ad-hoc signed and the notes say so.
    secrets: inherit

  windows:
    needs: preflight
    uses: ./.github/workflows/build-windows.yml
    with:
      sdk_version: ${{ inputs.sdk_version }}
    secrets: inherit

  publish:
    needs: [preflight, macos, windows]
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.macos.result == 'success' && needs.windows.result == 'success' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: GobanStudio-macOS-arm64
          path: dist-macos
      - uses: actions/download-artifact@v8
        with:
          name: GobanStudio-Windows-x64
          path: dist-windows
      - uses: actions/download-artifact@v8
        with:
          name: signing-status-macos
          path: signing
      - uses: actions/download-artifact@v8
        with:
          name: signing-status-windows
          path: signing
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: release notes with the real signing status
        env:
          TAG: ${{ inputs.tag }}
          MAC_SIGNING: ${{ needs.macos.outputs.signing }}
          WIN_SIGNING: ${{ needs.windows.outputs.signing }}
        run: |
          set -euo pipefail
          echo "macOS: ${MAC_SIGNING:-unknown}; Windows: ${WIN_SIGNING:-unknown}"
          cat signing/signing-macos.json signing/signing-windows.json
          notes=".github/release-notes/${TAG}.md"
          if [ ! -f "$notes" ]; then
            # Rehearsal without a notes file: a stub, so the table is still shown.
            printf '# Goban Studio %s\n\n## Download and first launch\n' "$TAG" > "$RUNNER_TEMP/stub.md"
            notes="$RUNNER_TEMP/stub.md"
          fi
          # The "First launch" table follows what the builds actually did,
          # whatever the notes file says.
          node scripts/signing-notes.mjs notes "$notes" signing/signing-macos.json signing/signing-windows.json > release-notes.md
          {
            echo "## Release notes as they will be published"
            echo
            cat release-notes.md
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md
      - name: verify packages
        run: |
          set -euo pipefail
          test -s dist-macos/GobanStudio-macOS-arm64.zip
          test -s dist-macos/GobanStudio-macOS-arm64.dmg
          test -s dist-windows/GobanStudio-Windows-x64.zip
          ls -lh dist-macos dist-windows
      - name: checksums
        run: |
          set -euo pipefail
          (cd dist-macos && sha256sum GobanStudio-macOS-arm64.zip GobanStudio-macOS-arm64.dmg) > SHA256SUMS
          (cd dist-windows && sha256sum GobanStudio-Windows-x64.zip) >> SHA256SUMS
          cat SHA256SUMS
      - name: publish
        if: ${{ inputs.rehearse != true }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --draft \
            --title "Goban Studio $TAG" \
            --notes-file release-notes.md
          gh release upload "$TAG" \
            dist-macos/GobanStudio-macOS-arm64.zip \
            dist-macos/GobanStudio-macOS-arm64.dmg \
            dist-windows/GobanStudio-Windows-x64.zip \
            SHA256SUMS
          gh release edit "$TAG" --draft=false
          gh release view "$TAG" --json url,isDraft,assets
