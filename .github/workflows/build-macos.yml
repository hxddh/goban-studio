name: build-macos

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "macOS runner image: macos-15 (Apple Silicon) or macos-15-intel (Intel, for arch x64)"
        required: false
        default: "macos-15"
      arch:
        description: "CPU of the build: arm64 (Apple Silicon) or x64 (Intel; needs an Intel runner)"
        required: false
        default: "arm64"
  workflow_call:
    inputs:
      runner:
        type: string
        required: false
        default: "macos-15"
      # v5: arm64 (default) or x64. The Intel package is built and tested
      # on an Intel runner (macos-15-intel), not cross-compiled.
      arch:
        type: string
        required: false
        default: "arm64"
    # Optional: with all five, the app is Developer ID signed and notarized;
    # without them it is ad-hoc signed (docs/signing.md). release.yml passes
    # them with `secrets: inherit`.
    secrets:
      MACOS_CERT_P12_BASE64:
        required: false
      MACOS_CERT_PASSWORD:
        required: false
      APPLE_ID:
        required: false
      APPLE_TEAM_ID:
        required: false
      APPLE_APP_PASSWORD:
        required: false
    outputs:
      signing:
        description: "developer-id+notarized | developer-id | adhoc"
        value: ${{ jobs.build.outputs.signing }}

permissions:
  contents: read

env:
  NPM_CONFIG_ENGINE_STRICT: "true"
  # KataGo v1.18.1, checked out by commit (a tag can be moved).
  KATAGO_COMMIT: 92ee95c0a4b25fec214da00951ab69e97e207729

jobs:
  build:
    runs-on: ${{ inputs.runner || 'macos-15' }}
    timeout-minutes: 100
    # Builds, tests and signs with a read-only token: nothing in this
    # workflow writes to the repository. Packages reach a release only
    # through release.yml, which checksums and signs them together.
    permissions:
      contents: read
    outputs:
      signing: ${{ steps.status.outputs.signing }}
    env:
      # GobanStudio-macOS-$ARCH.{zip,dmg}; artifact and status-file names
      # keep their v4 form for arm64 and gain "-x64" for Intel.
      ARCH: ${{ inputs.arch || 'arm64' }}
      SUFFIX: ${{ inputs.arch == 'x64' && '-x64' || '' }}
      # The signing secrets are not set here: each reaches only the steps
      # that read it (signing mode, import, notarization).
    steps:
      - name: runner CPU matches the requested build
        run: |
          set -euo pipefail
          cpu="$(uname -m)"
          case "$ARCH:$cpu" in
            arm64:arm64 | x64:x86_64) echo "building $ARCH on $cpu" ;;
            *) echo "arch $ARCH needs a matching runner (got $cpu): macos-15 for arm64, macos-15-intel for x64"; exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      - name: install build dependencies
        run: |
          npm ci --ignore-scripts
          brew install cmake ninja eigen
      - name: content gate
        run: npm run release-check
      - name: unit tests
        run: npm test
      - name: build KataGo Eigen sidecar
        # Built from source on the runner's own CPU (arm64, or x86_64 on the
        # Intel runner); USE_AVX2=OFF keeps the Intel build to SSE so it runs
        # on every Intel Mac that runs macOS 11+.
        run: |
          set -euo pipefail
          # Fetch exactly the pinned commit and check that is what we got.
          git init -q "$RUNNER_TEMP/KataGo"
          git -C "$RUNNER_TEMP/KataGo" fetch -q --depth 1 https://github.com/lightvector/KataGo.git "$KATAGO_COMMIT"
          git -C "$RUNNER_TEMP/KataGo" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/KataGo" rev-parse HEAD)" = "$KATAGO_COMMIT"
          # KataGo 1.18.1 calls quick_exit, which the macOS 14 SDK's libc++
          # does not declare. _Exit preserves immediate-exit fatal-error
          # semantics without requiring a newer deployment target.
          perl -0pi -e 's/quick_exit\(EXIT_FAILURE\)/_Exit(EXIT_FAILURE)/g' \
            "$RUNNER_TEMP/KataGo/cpp/core/global.cpp"
          cmake -S "$RUNNER_TEMP/KataGo/cpp" -B "$RUNNER_TEMP/KataGo/cpp/build" \
            -G Ninja -DUSE_BACKEND=EIGEN -DUSE_AVX2=OFF -DNO_GIT_REVISION=1 -DNO_LIBZIP=1 \
            -DCMAKE_PREFIX_PATH="$(brew --prefix)" \
            -DEIGEN3_INCLUDE_DIRS="$(brew --prefix eigen)/include/eigen3" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/KataGo/cpp/build" --parallel 4
          mkdir -p engine/macos
          cp "$RUNNER_TEMP/KataGo/cpp/build/katago" engine/macos/katago
          chmod +x engine/macos/katago
          file engine/macos/katago
          lipo -archs engine/macos/katago | grep -qw "$([ "$ARCH" = x64 ] && echo x86_64 || echo arm64)"
          codesign --force --sign - engine/macos/katago
      - name: KataGo smoke test
        run: |
          set -euo pipefail
          move=$(printf 'boardsize 19\nkomi 6.5\nkata-set-rules japanese\nplay B Q16\ngenmove W\nquit\n' | \
            engine/macos/katago gtp -model engine/model/model.txt.gz -config engine/model/gtp.cfg \
            -override-config "logDir=$RUNNER_TEMP,homeDataDir=$RUNNER_TEMP,logAllGTPCommunication=false,logSearchInfo=false,logToStderr=false,ponderingEnabled=false,allowResignation=false" \
            | grep -E '^= [A-HJ-T][0-9]+' | tail -1)
          test -n "$move"
          echo "KataGo answered: $move"
      - name: Native SDK from the lockfile
        # `npm ci` above installed @native-sdk/cli and the `native` binary
        # for this runner at the version and hashes in package-lock.json.
        # Its install script (skipped by --ignore-scripts) is run here: it
        # fetches the SDK's toolchain and checks every file against the
        # manifest inside the package (scripts/native-sdk.mjs).
        run: |
          set -euo pipefail
          node scripts/native-sdk.mjs toolchain
          echo "SDK_PATH=$(node scripts/native-sdk.mjs path)" >> "$GITHUB_ENV"
          echo "$(npm root)/.bin" >> "$GITHUB_PATH"
          node_modules/.bin/native --version
      - name: patch Native SDK (keep system menus around app menus)
        run: |
          # Idempotent; fails the build if the SDK source no longer has the
          # anchors the patch expects. See the script header.
          node scripts/patch-sdk.mjs "$SDK_PATH"
          node scripts/patch-sdk.mjs --check "$SDK_PATH"
      - name: build frontend
        run: |
          npm run build
          npm run sync
          node scripts/release-check.mjs
      - name: native validate and tests
        env:
          UPDATE_PUBKEY: ${{ vars.UPDATE_PUBKEY }}
        run: |
          native validate
          native test --yes \
            -Dnative-sdk-path="$SDK_PATH" -Dplatform=macos -Dupdate-pubkey="$UPDATE_PUBKEY"
      - name: native release build
        # ReleaseSafe: the shell parses page JSON and KataGo output, and a
        # bounds or cast bug must stop the app, not corrupt memory.
        # UPDATE_PUBKEY (empty when unset) is the key SHA256SUMS.sig is
        # checked against (docs/signing.md).
        env:
          UPDATE_PUBKEY: ${{ vars.UPDATE_PUBKEY }}
        run: |
          native build --yes \
            -Dnative-sdk-path="$SDK_PATH" -Dplatform=macos -Doptimize=ReleaseSafe -Dupdate-pubkey="$UPDATE_PUBKEY"
      - name: signing mode
        id: mode
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          # The fallback notice goes to stderr; echo it on stdout so the
          # runner turns it into an annotation.
          mode="$(bash scripts/macos-sign.sh mode 2> "$RUNNER_TEMP/signing-notice.txt")"
          cat "$RUNNER_TEMP/signing-notice.txt"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "macOS signing: $mode"
      - name: import Developer ID certificate
        if: ${{ steps.mode.outputs.mode == 'developer-id' }}
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: bash scripts/macos-sign.sh import
      - name: package app, install engine, sign
        run: |
          mkdir -p dist
          rm -rf dist/GobanStudio.app
          native package --target macos --signing adhoc --assets frontend/dist \
            --output dist/GobanStudio.app --binary zig-out/bin/goban-studio
          node scripts/install-engine.mjs dist/GobanStudio.app macos
          # Ad-hoc ("-") without the secrets; Developer ID + hardened runtime
          # + packaging/entitlements.plist with them. KataGo is signed first.
          bash scripts/macos-sign.sh sign dist/GobanStudio.app
          test -x "dist/GobanStudio.app/Contents/Resources/frontend/dist/engine/macos/katago"
          test -f "dist/GobanStudio.app/Contents/Resources/frontend/dist/engine/model/model.txt.gz"
          test -f "dist/GobanStudio.app/Contents/Resources/frontend/dist/licenses/Goban-Studio-MIT.txt"
          test -f "dist/GobanStudio.app/Contents/Resources/frontend/dist/content/book.json"
          # v9: the course, problems and classics past the start-up index (src/web/js/content.js)
          for f in course problems classics; do test -s "dist/GobanStudio.app/Contents/Resources/frontend/dist/content/$f.json"; done
          # The in-app updater installs a package only if the package itself
          # says it is the release's version (src/install.zig
          # stagedVersionMatches): both places must carry package.json's.
          version="$(node -p 'require("./package.json").version')"
          test "$(node -p 'require(process.argv[1]).app' "$PWD/dist/GobanStudio.app/Contents/Resources/frontend/dist/build-info.json")" = "$version"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/GobanStudio.app/Contents/Info.plist)" = "$version"
          codesign --verify --deep --strict dist/GobanStudio.app
          printf 'boardsize 19\nkata-set-rules japanese\ngenmove B\nquit\n' | \
            "dist/GobanStudio.app/Contents/Resources/frontend/dist/engine/macos/katago" gtp \
            -model "dist/GobanStudio.app/Contents/Resources/frontend/dist/engine/model/model.txt.gz" \
            -config "dist/GobanStudio.app/Contents/Resources/frontend/dist/engine/model/gtp.cfg" \
            -override-config "logDir=$RUNNER_TEMP,homeDataDir=$RUNNER_TEMP,logAllGTPCommunication=false,logSearchInfo=false,logToStderr=false,ponderingEnabled=false,allowResignation=false" \
            | grep -E '^= [A-HJ-T][0-9]+' | tail -1
      - name: self-test the packaged app
        # v5: includes the optional downloads end to end (pinned KataGo
        # release assets, 99 MB + 48 MB, into a temporary folder; see
        # scripts/selftest-app.mjs). GOBAN_SELFTEST_MODELS=0 skips them.
        timeout-minutes: 10
        run: |
          exe="$(find dist/GobanStudio.app/Contents/MacOS -type f -perm -u+x | head -n1)"
          test -n "$exe"
          lipo -archs "$exe" | grep -qw "$([ "$ARCH" = x64 ] && echo x86_64 || echo arm64)"
          node scripts/selftest-app.mjs "$exe"
      - name: updater end-to-end tests (swap, rollback, no exit, read-only fallback)
        timeout-minutes: 10
        run: |
          set -euo pipefail
          # What the app downloads and unpacks itself carries no quarantine
          # flag, because the app does not opt in to LSFileQuarantineEnabled
          # (src/install.zig's macOS test checks the unpacked bundle too), so
          # Gatekeeper does not stop the ad-hoc signed new version.
          if /usr/libexec/PlistBuddy -c 'Print :LSFileQuarantineEnabled' dist/GobanStudio.app/Contents/Info.plist >/dev/null 2>&1; then
            echo "LSFileQuarantineEnabled is set: downloaded updates would be quarantined"
            exit 1
          fi
          node scripts/test-updater.mjs dist/GobanStudio.app
      - name: updater live download from GitHub (network; informational)
        # Depends on github.com and on a published release that has this
        # CPU's package, so it does not gate the build.
        continue-on-error: true
        timeout-minutes: 12
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset="GobanStudio-macOS-${ARCH}.zip"
          tag="$(gh api 'repos/hxddh/goban-studio/releases?per_page=30' \
            --jq "[.[] | select(.draft == false and .prerelease == false) | select(any(.assets[]; .name == \"$asset\")) | select(any(.assets[]; .name == \"SHA256SUMS\"))] | .[0].tag_name // empty")"
          if [ -z "$tag" ]; then
            echo "::notice title=updater live test::no published release has $asset yet; skipped"
            exit 0
          fi
          node scripts/test-updater.mjs dist/GobanStudio.app --live "$tag"
      - name: native screenshot tour
        timeout-minutes: 6
        run: |
          # Today, a 19x19 game, its review, Practice and Settings, captured
          # with screencapture; each must be non-blank and differ from the
          # one before (scripts/screenshots.mjs).
          exe="$(find dist/GobanStudio.app/Contents/MacOS -type f -perm -u+x | head -n1)"
          node scripts/tour-app.mjs "$exe" dist/screenshots
      - name: upload native screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-screenshots-macos${{ inputs.arch == 'x64' && '-x64' || '' }}
          path: dist/screenshots
          if-no-files-found: ignore
      - name: notarize and staple the app
        if: ${{ steps.mode.outputs.mode == 'developer-id' }}
        timeout-minutes: 40
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/GobanStudio.app "$RUNNER_TEMP/GobanStudio-notarize.zip"
          bash scripts/macos-sign.sh notarize "$RUNNER_TEMP/GobanStudio-notarize.zip"
          xcrun stapler staple dist/GobanStudio.app
          bash scripts/macos-sign.sh verify-app dist/GobanStudio.app
      - name: zip and dmg
        run: |
          set -euo pipefail
          status="dist/signing-macos${SUFFIX}.json"
          if [ "${{ steps.mode.outputs.mode }}" = "developer-id" ]; then
            node scripts/signing-notes.mjs status macos developer-id --notarized > "$status"
          else
            node scripts/signing-notes.mjs status macos adhoc > "$status"
          fi
          # The README in the package says how this build was signed.
          node scripts/signing-notes.mjs readme packaging/README-macOS.txt "$status" > dist/README-macOS.txt
          # The .zip is also what the in-app updater installs: it must hold
          # GobanStudio.app at its root, under exactly that name (every
          # released app looks for it there; src/install.zig
          # stagedRootNames). The .dmg shows the same app as
          # "Goban Studio.app"; the README names both.
          ditto -c -k --sequesterRsrc --keepParent dist/GobanStudio.app "dist/GobanStudio-macOS-${ARCH}.zip"
          zip -g -j "dist/GobanStudio-macOS-${ARCH}.zip" dist/README-macOS.txt
          unzip -Z1 "dist/GobanStudio-macOS-${ARCH}.zip" | grep -x 'GobanStudio.app/Contents/MacOS/goban-studio' > /dev/null
          mkdir -p dist/dmg
          rm -rf dist/dmg/*
          ditto dist/GobanStudio.app "dist/dmg/Goban Studio.app"
          cp dist/README-macOS.txt dist/dmg/README-macOS.txt
          # Drag the app onto this to install it (README-macOS.txt, step 1).
          ln -s /Applications dist/dmg/Applications
          test -L dist/dmg/Applications
          hdiutil create -volname "Goban Studio" -srcfolder dist/dmg -ov -format UDZO "dist/GobanStudio-macOS-${ARCH}.dmg"
          bash scripts/macos-sign.sh sign-dmg "dist/GobanStudio-macOS-${ARCH}.dmg"
          ls -lh dist
      - name: notarize and staple the dmg
        if: ${{ steps.mode.outputs.mode == 'developer-id' }}
        timeout-minutes: 40
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          bash scripts/macos-sign.sh notarize "dist/GobanStudio-macOS-${ARCH}.dmg"
          spctl -a -vv -t open --context context:primary-signature "dist/GobanStudio-macOS-${ARCH}.dmg"
      - name: signing status
        id: status
        run: |
          cat "dist/signing-macos${SUFFIX}.json"
          if [ "${{ steps.mode.outputs.mode }}" = "developer-id" ]; then
            echo "signing=developer-id+notarized" >> "$GITHUB_OUTPUT"
            echo "### macOS ($ARCH): Developer ID signed, notarized and stapled" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "signing=adhoc" >> "$GITHUB_OUTPUT"
            echo "### macOS ($ARCH): ad-hoc signed, NOT notarized (signing secrets not set; docs/signing.md)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: remove signing keychain
        if: always()
        run: bash scripts/macos-sign.sh cleanup
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: GobanStudio-macOS-${{ inputs.arch || 'arm64' }}
          path: |
            dist/GobanStudio-macOS-${{ inputs.arch || 'arm64' }}.zip
            dist/GobanStudio-macOS-${{ inputs.arch || 'arm64' }}.dmg
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signing-status-macos${{ inputs.arch == 'x64' && '-x64' || '' }}
          path: dist/signing-macos${{ inputs.arch == 'x64' && '-x64' || '' }}.json
