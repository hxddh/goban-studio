<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Goban Studio assets</title>
<!-- Asset preview. Not linked from the app and not copied into frontend/dist.
     Serve the repository over HTTP (ES modules) and open /src/web/assets/preview.html. -->
<style>
  :root { --bg: #f4f1ea; --fg: #24211c; --muted: #6f685c; --card: #fffdf8; --line: #e3ddd0; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 -apple-system, "Inter Var", system-ui, sans-serif; }
  main { max-width: 1400px; margin: 0 auto; padding: 32px 24px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.01em; }
  h2 { font-size: 15px; margin: 40px 0 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
  p.lead { color: var(--muted); margin: 0 0 8px; }
  .boards { display: grid; grid-template-columns: repeat(auto-fill, minmax(620px, 1fr)); gap: 24px; }
  figure { margin: 0; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  figcaption { font-weight: 600; margin: 0 0 10px; display: flex; justify-content: space-between; }
  figcaption span { color: var(--muted); font-weight: 400; }
  canvas.board { width: 100%; aspect-ratio: 1; display: block; border-radius: 4px; }
  .stones { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .stones canvas { width: 112px; height: 112px; }
  .icons { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
  .icon { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 8px 8px; text-align: center; }
  .icon .pair { display: flex; gap: 14px; justify-content: center; align-items: center; height: 44px; }
  .icon small { display: block; color: var(--muted); margin-top: 6px; font-size: 11px; }
  .icons.dark .icon { background: #1f2421; border-color: #333a36; color: #e6ece8; }
  .brand { display: flex; gap: 28px; align-items: flex-end; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; flex-wrap: wrap; }
  .brand div { text-align: center; color: var(--muted); font-size: 11px; }
  .sounds { display: flex; flex-wrap: wrap; gap: 8px; }
  button { font: inherit; padding: 8px 14px; border-radius: 9px; border: 1px solid var(--line); background: var(--card); cursor: pointer; }
  button:hover { background: #fff; border-color: #cfc6b4; }
  .zoom { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .zoom canvas { width: 100%; aspect-ratio: 1; display: block; border-radius: 8px; border: 1px solid var(--line); }
</style>
</head>
<body>
<main>
  <h1>Goban Studio — materials, stones, icons, sounds</h1>
  <p class="lead">Everything on this page is generated by <code>node scripts/make-assets.mjs</code>.</p>

  <h2>Brand</h2>
  <div class="brand" id="brand"></div>

  <h2>Boards</h2>
  <div class="boards" id="boards"></div>

  <h2>Surface detail, 1:1 pixels</h2>
  <div class="zoom" id="zoom"></div>

  <h2>Stones</h2>
  <div class="stones" id="stones"></div>

  <h2>Icons</h2>
  <div class="icons" id="icons"></div>
  <div class="icons dark" id="icons-dark" style="margin-top: 8px"></div>

  <h2>Sounds</h2>
  <div class="sounds" id="sounds"></div>
</main>
<script type="module">
import { loadMaterials, setAssetBase, stoneVariant, THEME_COLORS, SURFACES } from "../js/materials.js";
import * as audio from "../js/audio.js";
import { ICONS, iconSVG } from "../js/app/icons.js";

setAssetBase("./");
audio.setSoundBase("sounds/");

const $ = (id) => document.getElementById(id);
const BLACK = 1, WHITE = -1;

// A short, plausible game fragment (column, row from the top).
const MOVES = [
  [15, 3], [3, 15], [16, 15], [3, 3], [14, 16], [2, 5], [9, 3], [16, 9], [15, 11], [13, 2],
  [12, 3], [16, 5], [15, 6], [16, 4], [15, 4], [6, 2], [5, 16], [3, 12], [2, 16], [2, 14],
  [9, 15], [10, 9], [9, 9], [10, 10], [9, 10], [10, 11], [8, 12], [11, 12], [4, 9], [13, 13],
  [12, 14], [13, 14], [12, 15], [3, 10], [4, 11],
];

function drawBoard(canvas, mats, surfaceName, { flat = false, size = 19 } = {}) {
  const dpr = window.devicePixelRatio || 1;
  const css = canvas.clientWidth;
  canvas.width = Math.round(css * dpr);
  canvas.height = Math.round(css * dpr);
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.imageSmoothingQuality = "high";
  const theme = THEME_COLORS[surfaceName];
  const surf = mats.surfaces[surfaceName];
  if (surf) ctx.drawImage(surf, 0, 0, css, css);
  else { ctx.fillStyle = "#ddb87e"; ctx.fillRect(0, 0, css, css); }
  const margin = css * 0.055;
  const cell = (css - margin * 2) / (size - 1);
  const px = (i) => margin + i * cell;
  ctx.strokeStyle = theme.line;
  ctx.lineWidth = Math.max(1, cell * 0.035);
  ctx.beginPath();
  for (let i = 1; i < size - 1; i++) {
    ctx.moveTo(px(0), Math.round(px(i) * dpr) / dpr + 0.5 / dpr); ctx.lineTo(px(size - 1), Math.round(px(i) * dpr) / dpr + 0.5 / dpr);
    ctx.moveTo(Math.round(px(i) * dpr) / dpr + 0.5 / dpr, px(0)); ctx.lineTo(Math.round(px(i) * dpr) / dpr + 0.5 / dpr, px(size - 1));
  }
  ctx.stroke();
  ctx.strokeStyle = theme.edge;
  ctx.lineWidth = Math.max(1.5, cell * 0.06);
  ctx.strokeRect(px(0), px(0), px(size - 1) - px(0), px(size - 1) - px(0));
  ctx.fillStyle = theme.star;
  for (const a of [3, 9, 15]) for (const b of [3, 9, 15]) { ctx.beginPath(); ctx.arc(px(a), px(b), cell * 0.11, 0, Math.PI * 2); ctx.fill(); }
  ctx.fillStyle = theme.text;
  ctx.font = `600 ${Math.round(cell * 0.32)}px -apple-system, system-ui, sans-serif`;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  const L = "ABCDEFGHJKLMNOPQRST";
  for (let i = 0; i < size; i++) {
    ctx.fillText(L[i], px(i), margin * 0.42);
    ctx.fillText(String(size - i), margin * 0.42, px(i));
  }
  const r = cell * 0.48;
  MOVES.forEach(([x, y], k) => {
    const color = k % 2 === 0 ? BLACK : WHITE;
    const h = ((x * 7 + y * 13) % 9) / 9 - 0.5;
    const cx = px(x) + h * cell * 0.05, cy = px(y) - h * cell * 0.04;
    if (!flat) {
      const g = ctx.createRadialGradient(cx + r * 0.1, cy + r * 0.16, r * 0.62, cx + r * 0.1, cy + r * 0.16, r * 1.12);
      g.addColorStop(0, theme.shadow); g.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx + r * 0.1, cy + r * 0.16, r * 1.12, 0, Math.PI * 2); ctx.fill();
    }
    const img = flat ? (color === BLACK ? mats.flatBlack : mats.flatWhite)
      : (color === BLACK ? mats.black : mats.white)[stoneVariant(x, y, color, (color === BLACK ? mats.black : mats.white).length)];
    if (img) ctx.drawImage(img, cx - r, cy - r, r * 2, r * 2);
    if (k === MOVES.length - 1) {
      ctx.fillStyle = color === BLACK ? "#f4efe4" : "#2a241c";
      ctx.beginPath(); ctx.arc(cx, cy, r * 0.22, 0, Math.PI * 2); ctx.fill();
    }
  });
}

function stonePreview(img) {
  const c = document.createElement("canvas");
  const dpr = window.devicePixelRatio || 1;
  c.width = c.height = 112 * dpr;
  const ctx = c.getContext("2d");
  ctx.imageSmoothingQuality = "high";
  if (img) ctx.drawImage(img, 0, 0, c.width, c.height);
  return c;
}

const mats = await loadMaterials();

// Brand
const brand = $("brand");
for (const s of [16, 24, 32, 64, 128]) brand.insertAdjacentHTML("beforeend", `<div><img src="brand.svg" width="${s}" height="${s}" alt=""><br>${s}px</div>`);
brand.insertAdjacentHTML("beforeend", `<div><img src="../../../assets/icon.png" width="256" height="256" alt=""><br>app icon (png)</div>`);
brand.insertAdjacentHTML("beforeend", `<div><img src="../../../assets/icon.svg" width="128" height="128" alt=""><br>icon.svg</div>`);
brand.insertAdjacentHTML("beforeend", `<div><img src="../../../assets/icon.png" width="32" height="32" alt=""><br>32px</div>`);

// Boards
const boards = $("boards");
const variants = [...SURFACES.map((s) => ({ s })), { s: "kaya", flat: true }];
for (const v of variants) {
  const fig = document.createElement("figure");
  fig.innerHTML = `<figcaption>${v.s}${v.flat ? " · flat stones" : ""}<span>line ${THEME_COLORS[v.s].line}</span></figcaption><canvas class="board"></canvas>`;
  boards.append(fig);
  drawBoard(fig.querySelector("canvas"), mats, v.s, { flat: !!v.flat });
}

// 1:1 detail crops
for (const s of SURFACES) {
  const c = document.createElement("canvas");
  $("zoom").append(c);
  const dpr = window.devicePixelRatio || 1;
  c.width = c.clientWidth * dpr; c.height = c.clientWidth * dpr;
  const img = mats.surfaces[s];
  if (img) c.getContext("2d").drawImage(img, 820, 820, c.width, c.height, 0, 0, c.width, c.height);
}

// Stones
for (const img of [...mats.white, ...mats.black, mats.flatWhite, mats.flatBlack]) $("stones").append(stonePreview(img));

// Icons
for (const target of ["icons", "icons-dark"]) {
  for (const name of Object.keys(ICONS)) {
    $(target).insertAdjacentHTML("beforeend", `<div class="icon"><div class="pair">${iconSVG(name, { size: 20 })}${iconSVG(name, { size: 40 })}</div><small>${name}</small></div>`);
  }
}

// Sounds
const sounds = [
  ["stone · kaya", () => { audio.setMaterial("kaya"); audio.stone(); }],
  ["stone · slate/paper", () => { audio.setMaterial("slate"); audio.stone(); }],
  ["stone + capture", () => { audio.setMaterial("kaya"); audio.stone(true); }],
  ["capture 1", () => audio.capture(1)],
  ["capture 3", () => audio.capture(3)],
  ["capture 8", () => audio.capture(8)],
  ["pass", () => audio.pass()],
  ["correct", () => audio.correct()],
  ["wrong", () => audio.wrong()],
  ["game end", () => audio.gameEnd()],
  ["win", () => audio.win()],
  ["lose", () => audio.lose()],
];
for (const [label, fn] of sounds) {
  const b = document.createElement("button");
  b.textContent = label;
  b.onclick = fn;
  $("sounds").append(b);
}
document.body.dataset.ready = "1";
</script>
</body>
</html>
