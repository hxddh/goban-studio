<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- WebView2 executes its `window.zero` bridge through
       AddScriptToExecuteOnDocumentCreated, which is subject to the page CSP;
       macOS user scripts are not. Without 'unsafe-inline' the page renders,
       but hasNative() is false and no native command reaches the host. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'" />
  <title>Goban Studio</title>
  <link rel="icon" href="icon.png" type="image/png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" data-view="play" data-theme="light">
    <aside class="rail">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="brand-name">Goban Studio</span>
        <span class="brand-sub" data-i18n="app.tagline">从第一手开始</span>
      </div>
      <nav class="nav" aria-label="Main">
        <button class="nav-btn" data-view="play" type="button">
          <span class="nav-ic" data-icon="board" aria-hidden="true"></span><span data-i18n="nav.play">对弈</span>
        </button>
        <button class="nav-btn" data-view="review" type="button">
          <span class="nav-ic" data-icon="chart" aria-hidden="true"></span><span data-i18n="nav.review">复盘</span>
        </button>
        <button class="nav-btn" data-view="learn" type="button">
          <span class="nav-ic" data-icon="book" aria-hidden="true"></span><span data-i18n="nav.learn">学习</span>
        </button>
        <button class="nav-btn" data-view="library" type="button">
          <span class="nav-ic" data-icon="folder" aria-hidden="true"></span><span data-i18n="nav.library">棋谱</span>
        </button>
      </nav>
      <div class="rail-foot">
        <button class="nav-btn" data-view="settings" type="button">
          <span class="nav-ic" data-icon="gear" aria-hidden="true"></span><span data-i18n="nav.settings">设置</span>
        </button>
        <span class="version">1.1.1</span>
      </div>
    </aside>

    <div class="shell">
      <header class="topbar">
        <div class="topbar-title">
          <h1 id="view-title" data-i18n="nav.play">对弈</h1>
          <span id="status" class="status"></span>
        </div>
        <div id="topbar-actions" class="actions"></div>
      </header>

      <main class="main">
        <section id="board-panel" class="board-panel">
          <div id="board-frame" class="board-frame">
            <canvas id="board" aria-label="Go board"></canvas>
            <div id="board-badge" class="board-badge" hidden></div>
          </div>
          <div id="board-caption" class="board-caption"></div>
        </section>
        <aside id="side" class="side">
          <div id="side-content" class="side-content"></div>
        </aside>
        <section id="page" class="page" hidden></section>
      </main>
    </div>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <dialog id="dialog" class="dialog">
    <div class="dialog-head">
      <h2 id="dialog-title"></h2>
      <button id="dialog-close" class="icon-btn" type="button" aria-label="Close">×</button>
    </div>
    <div id="dialog-body" class="dialog-body"></div>
    <div id="dialog-actions" class="dialog-actions"></div>
  </dialog>

  <input id="file-input" type="file" accept=".sgf,application/x-go-sgf" hidden />
  <script type="module" src="moka/host.js"></script>
  <script src="js/bundle.js"></script>
</body>
</html>
