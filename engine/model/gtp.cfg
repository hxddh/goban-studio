# Goban Studio KataGo sidecar. The native host overrides logDir,
# homeDataDir and the logging switches so a packaged, read-only app never
# tries to write beside its executable.
numSearchThreads = 4
ponderingEnabled = false
maxVisits = 200
maxTime = 6.0
allowResignation = false
resignThreshold = -0.99
rules = japanese
logAllGTPCommunication = false
logSearchInfo = false
logToStderr = false
# The page reads every win rate, score lead and ownership value from
# Black's point of view.
reportAnalysisWinratesAs = BLACK
# Enough candidate lines for review and hints, short enough to parse fast.
analysisPVLen = 8
# The host searches with `kata-search_analyze_cancellable` (v3): a bounded
# search under the regular maxVisits/maxTime (set per request with
# kata-set-param), partial `info` reports every 0.2 s when the page streams
# (`interval 20`), and a bare newline from the host stops it. Pondering stays
# off, so nothing searches between requests.
