# Goban Studio: KataGo with the optional human SL model (v5).
#
# Started only when a human-style game needs a move, as
#   katago gtp -model model.txt.gz -human-model <data>/models/b18c384nbt-humanv0.bin.gz -config human.cfg
# The b6c96 network searches a few visits to decide when to pass; the human
# SL model chooses every other move. Based on KataGo's
# cpp/configs/gtp_human5k_example.cfg (raw human policy, one network
# evaluation per move). The native host sets humanSLProfile per request
# (e.g. rank_12k) and switches the move-choice parameters between that
# recipe ("raw") and gtp_human9d_search_example.cfg ("search") with
# kata-set-param; see src/engine.zig `style_params`. As in gtp.cfg, the host
# overrides logDir, homeDataDir and the logging switches.
numSearchThreads = 2
ponderingEnabled = false
maxVisits = 40
maxTime = 6.0
allowResignation = false
resignThreshold = -0.99
rules = japanese
logAllGTPCommunication = false
logSearchInfo = false
logToStderr = false
reportAnalysisWinratesAs = BLACK
analysisPVLen = 8

# Human SL (gtp_human5k_example.cfg). The profile is set at run time.
humanSLChosenMoveProp = 1.0
humanSLChosenMoveIgnorePass = true
humanSLChosenMovePiklLambda = 100000000
humanSLRootExploreProbWeightless = 0.0
humanSLRootExploreProbWeightful = 0.0
humanSLPlaExploreProbWeightless = 0.0
humanSLPlaExploreProbWeightful = 0.0
humanSLOppExploreProbWeightless = 0.0
humanSLOppExploreProbWeightful = 0.0
humanSLCpuctExploration = 0.50
humanSLCpuctPermanent = 0.2

chosenMoveTemperatureEarly = 0.85
chosenMoveTemperature = 0.70
chosenMoveTemperatureHalflife = 80
chosenMoveTemperatureOnlyBelowProb = 0.01
chosenMoveSubtract = 0
chosenMovePrune = 0

nnCacheSizePowerOfTwo = 17
nnMutexPoolSizePowerOfTwo = 14

# Humans play differently depending on the last moves: keep the history.
ignorePreRootHistory = false
analysisIgnorePreRootHistory = false
rootNumSymmetriesToSample = 2
useLcbForSelection = false
winLossUtilityFactor = 1.0
staticScoreUtilityFactor = 0.30
dynamicScoreUtilityFactor = 0.00
useUncertainty = false
subtreeValueBiasFactor = 0.0
useNoisePruning = false
